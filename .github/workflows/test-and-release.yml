name: Test and Release

on:
    push:
        branches: ['main']
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ubuntu-latest
        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  lint: true

    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        needs: [check-and-lint]
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, windows-latest, macos-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}

    # The deploy action runs "npm publish" unconditionally, which fails for a
    # version that is already on npm - such as 0.1.0, published by hand
    # because trusted publishing can only be set up for an existing package.
    check-published:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.lookup.outputs.published }}
        steps:
            - id: lookup
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  if npm view "iobroker.energypriceforecast@${version}" version > /dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

    deploy:
        needs: [check-and-lint, adapter-tests, check-published]
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v') &&
            needs.check-published.outputs.published == 'false'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
