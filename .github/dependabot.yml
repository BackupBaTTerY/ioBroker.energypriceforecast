version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
      versioning-strategy: increase
      ignore:
          # Must follow the lowest supported Node version, not the newest.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      open-pull-requests-limit: 5
